# SSH tüneli girişi. docker-compose bu portu YALNIZCA sunucunun 127.0.0.1:3000 adresine yayınlar;
# internetten erişilemez. Yerel admin uygulaması `ssh -L ...:127.0.0.1:3000` ile buraya bağlanır.
# Uygulama konteyneri internete kapalı iç ağda olduğu için admin trafiği de Nginx üzerinden geçer.
server {
    listen 3000;
    server_name _;
    client_max_body_size 1m;

    # Tünelden yalnızca admin API'si ve socket.io kullanılır
    location ^~ /api/admin/ {
        include /etc/nginx/snippets/proxy.conf;
    }

    location /socket.io/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location / {
        return 404;
    }
}
