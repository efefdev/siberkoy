# Uygulamaya iletilen protokol (snippets/proxy.conf). Bu kurulumda TLS'i bu Nginx sonlandırır.
map $scheme $siberkoy_proto {
    default $scheme;
}

# HTTP → HTTPS yönlendirme (Certbot doğrulaması için /.well-known hariç)
server {
    listen 80;
    server_name siberkoy.omusiber.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS sunucusu
server {
    listen 443 ssl;
    http2 on;
    server_name siberkoy.omusiber.org;

    # TLS Sertifikaları (Certbot yönetir)
    ssl_certificate /etc/letsencrypt/live/siberkoy.omusiber.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siberkoy.omusiber.org/privkey.pem;

    # TLS güvenliği
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # Let's Encrypt OCSP'yi 2025'te kapattığı için ssl_stapling kullanılmıyor.

    # Güvenlik başlıkları
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # İstek boyutu limiti
    client_max_body_size 1m;

    # ── Admin API: internete KAPALI ─────────────────────────────
    # Admin, yerel uygulamayla SSH tüneli üzerinden doğrudan 127.0.0.1:3000'e bağlanır.
    # Yalnızca acil durumda (scripts/admin-acil.sh) izin verilen tek IP buradan geçebilir.
    location ^~ /api/admin/ {
        if ($admin_emergency_ip = 0) {
            return 404;
        }
        limit_req zone=api burst=200 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Eski web admin paneli kaldırıldı
    location ^~ /admin {
        return 404;
    }

    # Anlatıcı girişine sıkı rate limit
    location = /api/narrator/login {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Oyuncu katılımı: ortak Wi-Fi'de ~100 kişinin aynı anda girebilmesi için yüksek limit
    location = /api/player/join {
        limit_req zone=join burst=50 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Genel API rate limit (skor güncellemesinde ~100 istemci aynı anda yeniler)
    location /api/ {
        limit_req zone=api burst=200 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
    }

    # WebSocket (Socket.io)
    location /socket.io/ {
        limit_conn ws 300;
        include /etc/nginx/snippets/proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Statik dosyalar (Next.js)
    location /_next/static/ {
        include /etc/nginx/snippets/proxy.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Bir location'da add_header kullanılınca üst seviyedekiler miras alınmaz; tekrar ediyoruz.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Genel trafik
    location / {
        include /etc/nginx/snippets/proxy.conf;
    }
}
