# Gerçek istemci IP'si (Cloudflare Tunnel · cloudflared konteyneri siberkoy ağından bağlanır):
# CF-Connecting-IP'yi Cloudflare her istekte kendisi yazar; istemci bu başlığı taklit edemez.
# X-Real-IP'ye GÜVENİLMEZ: cloudflared istemcinin gönderdiği başlıkları olduğu gibi iletir.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
