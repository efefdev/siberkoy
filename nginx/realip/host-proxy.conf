# Gerçek istemci IP'si (ana web sunucusu 127.0.0.1:<SIBERKOY_HTTP_PORT>'a iletiyorsa · deploy/vps şablonları):
# yalnızca ana sunucunun yazdığı X-Real-IP başlığına güvenilir. Port yalnızca 127.0.0.1'e yayınlandığı için
# bu adreslerden gelen bağlantı sunucunun kendisidir. Ana sunucu X-Real-IP'yi her istekte EZER (şablonlar öyle
# yazar); istemci bu başlığı taklit edemez.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;
