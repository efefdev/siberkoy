# Uygulamaya yönlendirme için ortak başlıklar.
# Değişkenle proxy_pass: "app" adı her istekte Docker DNS'inden (nginx.conf'taki resolver) çözülür.
# Böylece uygulama konteyneri yeniden oluşturulup IP'si değişince Nginx eski IP'ye takılıp 502 vermez.
set $siberkoy_app http://app:3000;
proxy_pass $siberkoy_app;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $siberkoy_proto;
# İstemcinin gönderdiği değer her zaman ezilir. Uygulama "public" gelen isteklere admin yetkisi vermez.
proxy_set_header X-Siberkoy-Via $siberkoy_via;
