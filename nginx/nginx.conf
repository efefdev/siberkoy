user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Güvenlik: Nginx versiyon bilgisini gizle
    server_tokens off;

    # Gzip sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate limiting tanımları
    # Not: Etkinlikte oyuncular kampüs Wi-Fi'sinden bağlanır ve dışarıya AYNI IP ile çıkar.
    # Bu yüzden oyuncu katılımı ve genel API limitleri yüksek; admin/anlatıcı girişi sıkı tutulur
    # (uygulama içinde ayrıca IP + hesap bazlı başarısız deneme kilidi vardır).
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=join:10m rate=120r/m;
    limit_conn_zone $binary_remote_addr zone=ws:10m;

    # Admin API'si internete kapalıdır (SSH tüneliyle erişilir). Acil durumda scripts/admin-acil.sh
    # tek bir IP'yi süreli olarak bu listeye ekler.
    geo $admin_emergency_ip {
        default 0;
        include /etc/nginx/emergency/allow.conf;
    }
    map $admin_emergency_ip $siberkoy_via_public {
        1 admin-emergency;
        default public;
    }
    # 3000 portu yalnızca sunucunun kendi içine açıktır (SSH tüneli): oradan gelenler "tunnel" olarak işaretlenir.
    map $server_port $siberkoy_via {
        3000 tunnel;
        default $siberkoy_via_public;
    }

    # Docker'ın gömülü DNS'i (snippets/proxy.conf'taki değişkenli proxy_pass için)
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    include /etc/nginx/conf.d/*.conf;
}
