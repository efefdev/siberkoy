# VPS (paylaşımlı sunucu) kurulumu: bu Nginx internete AÇILMAZ.
# Sunucuda zaten çalışan ana web sunucusu (omusiber.org'u sunan) alt alan adı için TLS'i sonlandırır ve
# isteği yalnızca 127.0.0.1:<SIBERKOY_HTTP_PORT> üzerinden buraya iletir (deploy/vps/ şablonları).
# docker-compose.vps.yml bu klasörü conf.d yerine bağlar.

# Uygulamaya iletilen protokol: genel trafik ana sunucuda HTTPS ile sonlanır. Tünel (3000) iç trafiktir.
map $server_port $siberkoy_proto {
    3000    $scheme;
    default https;
}

server {
    listen 8080;
    server_name _;

    # Gerçek istemci IP'si: yayın yöntemine göre nginx/realip/ altındaki dosyalardan biri bağlanır
    # (docker-compose.vps.yml · SIBERKOY_REALIP).
    include /etc/nginx/realip.conf;

    # Güvenlik başlıkları (ana sunucu da eklerse tarayıcı aynısını iki kez görür; zararsızdır)
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 1m;

    # ── Admin API: internete KAPALI (SSH tüneliyle tunnel.conf üzerinden) ──
    location ^~ /api/admin/ {
        if ($admin_emergency_ip = 0) {
            return 404;
        }
        limit_req zone=api burst=200 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /admin {
        return 404;
    }

    location = /api/narrator/login {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
    }

    location = /api/player/join {
        limit_req zone=join burst=50 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/ {
        limit_req zone=api burst=200 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /socket.io/ {
        limit_conn ws 300;
        include /etc/nginx/snippets/proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /_next/static/ {
        include /etc/nginx/snippets/proxy.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        include /etc/nginx/snippets/proxy.conf;
    }
}
